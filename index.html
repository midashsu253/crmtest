<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客戶管理系統</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="客戶管理系統">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; background:#f5f5f5; }
header { background:#2a9d8f; color:white; padding:1rem; text-align:center; font-size:1.5rem; }
.container { padding:1rem; }
button { padding:0.5rem 1rem; margin:0.3rem; background:#2a9d8f; color:white; border:none; border-radius:4px; cursor:pointer; }
button:hover { background:#21867a; }
input, select { padding:0.4rem; margin:0.3rem 0; width:100%; box-sizing:border-box; }
.card { background:white; padding:1rem; margin:0.5rem 0; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
h3 { margin:0.5rem 0; }
.section { margin-bottom:1.5rem; }
.nav { display:flex; justify-content:space-around; background:#264653; color:white; padding:0.5rem 0; }
.nav div { cursor:pointer; }
.nav div.active { text-decoration:underline; font-weight:bold; }
</style>
</head>
<body>

<header>客戶管理系統</header>

<div class="nav">
  <div id="nav-customer" class="active">客戶</div>
  <div id="nav-order">訂單</div>
  <div id="nav-visit">拜訪</div>
  <div id="nav-inventory">庫存</div>
</div>

<div class="container">
  <div id="section-customer" class="section">
    <h3>新增客戶</h3>
    <input type="text" id="customer-name" placeholder="客戶姓名">
    <input type="text" id="customer-phone" placeholder="電話">
    <input type="text" id="customer-email" placeholder="Email">
    <button onclick="addCustomer()">新增</button>

    <h3>客戶列表</h3>
    <div id="customer-list"></div>
  </div>

  <div id="section-order" class="section" style="display:none;">
    <h3>新增訂單</h3>
    <select id="order-customer"></select>
    <input type="text" id="order-item" placeholder="商品名稱">
    <input type="number" id="order-qty" placeholder="數量">
    <button onclick="addOrder()">新增訂單</button>

    <h3>訂單列表</h3>
    <div id="order-list"></div>
  </div>

  <div id="section-visit" class="section" style="display:none;">
    <h3>新增拜訪紀錄</h3>
    <select id="visit-customer"></select>
    <input type="date" id="visit-date">
    <input type="text" id="visit-note" placeholder="拜訪內容">
    <button onclick="addVisit()">新增紀錄</button>

    <h3>拜訪列表</h3>
    <div id="visit-list"></div>
  </div>

  <div id="section-inventory" class="section" style="display:none;">
    <h3>新增庫存紀錄</h3>
    <input type="text" id="inventory-item" placeholder="商品名稱">
    <input type="number" id="inventory-qty" placeholder="數量">
    <button onclick="addInventory()">新增庫存</button>

    <h3>庫存列表</h3>
    <div id="inventory-list"></div>
  </div>
</div>

<script>
// ======== IndexedDB 簡易封裝 ========
let db;
const request = indexedDB.open('CRMDB', 1);
request.onupgradeneeded = function(e){
  db = e.target.result;
  db.createObjectStore('customers', { keyPath:'id', autoIncrement:true });
  db.createObjectStore('orders', { keyPath:'id', autoIncrement:true });
  db.createObjectStore('visits', { keyPath:'id', autoIncrement:true });
  db.createObjectStore('inventory', { keyPath:'id', autoIncrement:true });
}
request.onsuccess = function(e){ db=e.target.result; refreshAll(); }

// ======== 切換頁面 ========
document.getElementById('nav-customer').onclick = ()=>showSection('customer');
document.getElementById('nav-order').onclick = ()=>showSection('order');
document.getElementById('nav-visit').onclick = ()=>showSection('visit');
document.getElementById('nav-inventory').onclick = ()=>showSection('inventory');

function showSection(sec){
  ['customer','order','visit','inventory'].forEach(s=>{
    document.getElementById('section-'+s).style.display = s===sec?'block':'none';
    document.getElementById('nav-'+s).classList.toggle('active', s===sec);
  });
  if(sec==='order') refreshOrderCustomer();
  if(sec==='visit') refreshVisitCustomer();
}

// ======== CRUD 功能 ========
function addCustomer(){
  const name=document.getElementById('customer-name').value.trim();
  if(!name) return alert('請輸入姓名');
  const phone=document.getElementById('customer-phone').value.trim();
  const email=document.getElementById('customer-email').value.trim();
  const tx = db.transaction('customers','readwrite');
  tx.objectStore('customers').add({name,phone,email});
  tx.oncomplete = ()=>{ document.getElementById('customer-name').value=''; refreshAll(); };
}

function addOrder(){
  const customerId=parseInt(document.getElementById('order-customer').value);
  const item=document.getElementById('order-item').value.trim();
  const qty=parseInt(document.getElementById('order-qty').value);
  if(!customerId || !item || !qty) return alert('請完整填寫');
  const tx = db.transaction('orders','readwrite');
  tx.objectStore('orders').add({customerId,item,qty});
  tx.oncomplete = ()=>{ document.getElementById('order-item').value=''; document.getElementById('order-qty').value=''; refreshAll(); };
}

function addVisit(){
  const customerId=parseInt(document.getElementById('visit-customer').value);
  const date=document.getElementById('visit-date').value;
  const note=document.getElementById('visit-note').value.trim();
  if(!customerId || !date || !note) return alert('請完整填寫');
  const tx = db.transaction('visits','readwrite');
  tx.objectStore('visits').add({customerId,date,note});
  tx.oncomplete = ()=>{ document.getElementById('visit-note').value=''; refreshAll(); };
}

function addInventory(){
  const item=document.getElementById('inventory-item').value.trim();
  const qty=parseInt(document.getElementById('inventory-qty').value);
  if(!item || !qty) return alert('請完整填寫');
  const tx = db.transaction('inventory','readwrite');
  tx.objectStore('inventory').add({item,qty});
  tx.oncomplete = ()=>{ document.getElementById('inventory-item').value=''; document.getElementById('inventory-qty').value=''; refreshAll(); };
}

// ======== 刷新列表 ========
function refreshAll(){
  refreshCustomerList();
  refreshOrderList();
  refreshVisitList();
  refreshInventoryList();
  refreshOrderCustomer();
  refreshVisitCustomer();
}

function refreshCustomerList(){
  const list=document.getElementById('customer-list');
  list.innerHTML='';
  const tx = db.transaction('customers','readonly');
  const store = tx.objectStore('customers');
  store.openCursor().onsuccess = function(e){
    const cursor=e.target.result;
    if(cursor){
      const c=cursor.value;
      const div=document.createElement('div');
      div.className='card';
      div.textContent=`${c.name} / ${c.phone} / ${c.email}`;
      list.appendChild(div);
      cursor.continue();
    }
  }
}

function refreshOrderList(){
  const list=document.getElementById('order-list');
  list.innerHTML='';
  const tx=db.transaction(['orders','customers'],'readonly');
  const orders=tx.objectStore('orders');
  const customers=tx.objectStore('customers');
  orders.openCursor().onsuccess=function(e){
    const cursor=e.target.result;
    if(cursor){
      const o=cursor.value;
      const getCustomer=customers.get(o.customerId);
      getCustomer.onsuccess=function(){ 
        const c=getCustomer.result; 
        const div=document.createElement('div');
        div.className='card';
        div.textContent=`${c?c.name:'未知客戶'}: ${o.item} x ${o.qty}`;
        list.appendChild(div);
      }
      cursor.continue();
    }
  }
}

function refreshVisitList(){
  const list=document.getElementById('visit-list');
  list.innerHTML='';
  const tx=db.transaction(['visits','customers'],'readonly');
  const visits=tx.objectStore('visits');
  const customers=tx.objectStore('customers');
  visits.openCursor().onsuccess=function(e){
    const cursor=e.target.result;
    if(cursor){
      const v=cursor.value;
      const getCustomer=customers.get(v.customerId);
      getCustomer.onsuccess=function(){
        const c=getCustomer.result;
        const div=document.createElement('div');
        div.className='card';
        div.textContent=`${v.date} ${c?c.name:'未知客戶'}: ${v.note}`;
        list.appendChild(div);
      }
      cursor.continue();
    }
  }
}

function refreshInventoryList(){
  const list=document.getElementById('inventory-list');
  list.innerHTML='';
  const tx=db.transaction('inventory','readonly');
  const store=tx.objectStore('inventory');
  store.openCursor().onsuccess=function(e){
    const cursor=e.target.result;
    if(cursor){
      const i=cursor.value;
      const div=document.createElement('div');
      div.className='card';
      div.textContent=`${i.item} x ${i.qty}`;
      list.appendChild(div);
      cursor.continue();
    }
  }
}

function refreshOrderCustomer(){
  const sel=document.getElementById('order-customer');
  sel.innerHTML='<option value="">選擇客戶</option>';
  const tx=db.transaction('customers','readonly');
  tx.objectStore('customers').openCursor().onsuccess=function(e){
    const cursor=e.target.result;
    if(cursor){
      const c=cursor.value;
      const opt=document.createElement('option');
      opt.value=c.id; opt.textContent=c.name;
      sel.appendChild(opt);
      cursor.continue();
    }
  }
}

function refreshVisitCustomer(){
  const sel=document.getElementById('visit-customer');
  sel.innerHTML='<option value="">選擇客戶</option>';
  const tx=db.transaction('customers','readonly');
  tx.objectStore('customers').openCursor().onsuccess=function(e){
    const cursor=e.target.result;
    if(cursor){
      const c=cursor.value;
      const opt=document.createElement('option');
      opt.value=c.id; opt.textContent=c.name;
      sel.appendChild(opt);
      cursor.continue();
    }
  }
}

// ======== PWA Service Worker ========
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>console.log('Service Worker 已註冊'));
}
</script>

</body>
</html>
