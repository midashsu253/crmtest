<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>客戶管理首頁</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module" src="https://unpkg.com/idb?module"></script>
<style>
:root{--bg:#f4f6f8;--card:#ffffff;--text:#1f1f1f;--accent:#4e9eff;--input:#f5f5f5;}
body{background:var(--bg);color:var(--text);}
input,textarea,select{background:var(--input);color:var(--text);}
.card{background:var(--card);}
.btn:hover{transform:translateY(-1px);}
</style>
</head>
<body class="p-6 min-h-screen">
<div class="max-w-5xl mx-auto">
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-semibold">客戶管理首頁</h1>
    <button id="addCustomerBtn" class="px-3 py-2 rounded-md btn bg-[var(--accent)] text-white">＋新增客戶</button>
  </header>

  <section class="card p-4 rounded-lg">
    <div class="mb-2">
      <input type="text" id="searchInput" placeholder="搜尋客編 / 姓名 / 電話" class="w-full p-2 rounded-md">
    </div>
    <table class="w-full text-sm border-collapse">
      <thead>
        <tr class="border-b border-gray-300">
          <th class="p-1 text-left">客編</th>
          <th class="p-1 text-left">姓名</th>
          <th class="p-1 text-left">電話</th>
          <th class="p-1 text-left">備註</th>
        </tr>
      </thead>
      <tbody id="customerList"></tbody>
    </table>
    <div class="flex justify-center mt-2">
      <button id="prevPage" class="px-2 py-1 rounded-md btn bg-[var(--accent)] text-white mr-2">上一頁</button>
      <button id="nextPage" class="px-2 py-1 rounded-md btn bg-[var(--accent)] text-white">下一頁</button>
    </div>
  </section>
</div>

<script type="module">
import { openDB } from 'https://unpkg.com/idb?module';
const db = await openDB('glucoseCRM',1,{upgrade(db){if(!db.objectStoreNames.contains('customers'))db.createObjectStore('customers',{keyPath:'id',autoIncrement:true});}});

const searchInput=document.getElementById('searchInput');
const customerList=document.getElementById('customerList');
const addCustomerBtn=document.getElementById('addCustomerBtn');
const prevPageBtn=document.getElementById('prevPage');
const nextPageBtn=document.getElementById('nextPage');

let allCustomers=[];
let page=0;
const pageSize=10;

// =====================
// 載入資料
// =====================
async function loadCustomers(){
  allCustomers = await db.getAll('customers');
  renderList();
}

// =====================
// 渲染列表
// =====================
function renderList(){
  const filter=searchInput.value.trim().toLowerCase();
  let filtered=allCustomers.filter(c=>{
    return c.code?.toLowerCase().includes(filter) || 
           c.name?.toLowerCase().includes(filter) ||
           c.phone?.toLowerCase().includes(filter);
  });

  const start=page*pageSize;
  const end=start+pageSize;
  const pageItems=filtered.slice(start,end);

  customerList.innerHTML='';
  pageItems.forEach(c=>{
    const tr=document.createElement('tr');
    tr.className='cursor-pointer border-b border-gray-200 hover:bg-gray-100';
    tr.innerHTML=`
      <td class="p-1">${c.code||''}</td>
      <td class="p-1">${c.name||''}</td>
      <td class="p-1">${c.phone||''}</td>
      <td class="p-1">${c.note||''}</td>
    `;
    tr.addEventListener('click',()=>{window.location.href=`customer.html?id=${c.id}`;});
    customerList.appendChild(tr);
  });
}

// =====================
// 搜尋事件
// =====================
searchInput.addEventListener('input',()=>{
  page=0;
  renderList();
});

// =====================
// 分頁
// =====================
prevPageBtn.addEventListener('click',()=>{
  if(page>0){page--; renderList();}
});
nextPageBtn.addEventListener('click',()=>{
  const filter=searchInput.value.trim().toLowerCase();
  const filtered=allCustomers.filter(c=>{
    return c.code?.toLowerCase().includes(filter) || 
           c.name?.toLowerCase().includes(filter) ||
           c.phone?.toLowerCase().includes(filter);
  });
  if((page+1)*pageSize<filtered.length){page++; renderList();}
});

// =====================
// 新增客戶
// =====================
addCustomerBtn.addEventListener('click',()=>{window.location.href='customer.html';});

loadCustomers();
</script>
</body>
</html>
