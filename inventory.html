<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>庫存管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module" src="https://unpkg.com/idb?module"></script>
<style>
:root{--bg:#f0f2f5;--card:#ffffff;--text:#1f1f1f;--accent:#4e9eff;--input:#f5f5f5;}
body{background:var(--bg);color:var(--text);}
.card{background:var(--card);}
input,textarea,select{background:var(--input);color:var(--text);}
.btn:hover{transform:translateY(-1px);}
</style>
</head>
<body class="p-4 min-h-screen">
<div class="max-w-5xl mx-auto">
<header class="flex justify-between items-center mb-4">
  <h1 class="text-xl font-semibold">庫存管理</h1>
  <button id="backBtn" class="px-3 py-2 rounded-md btn bg-[var(--accent)] text-white">⬅ 返回</button>
</header>

<section class="card p-4 rounded-lg mb-4">
  <button id="addStockBtn" class="px-3 py-2 rounded-md btn bg-[var(--accent)] text-white mb-2">＋ 新增庫存</button>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-1 border">品項</th>
        <th class="p-1 border">上次庫存</th>
        <th class="p-1 border">此次庫存</th>
        <th class="p-1 border">最後進貨日期</th>
        <th class="p-1 border">最後進貨數量</th>
        <th class="p-1 border">操作</th>
      </tr>
    </thead>
    <tbody id="inventoryTable"></tbody>
  </table>
</section>
</div>

<script type="module">
import { openDB } from 'https://unpkg.com/idb?module';

async function init(){
  const db = await openDB('glucoseCRM',1,{
    upgrade(db){
      if(!db.objectStoreNames.contains('customers'))
        db.createObjectStore('customers',{keyPath:'id',autoIncrement:true});
    }
  });

  const params=new URLSearchParams(location.search);
  const custId=params.get('id')?Number(params.get('id')):null;
  if(!custId){alert('缺少客戶ID'); location.href='index.html'; return;}

  const backBtn=document.getElementById('backBtn');
  const addStockBtn=document.getElementById('addStockBtn');
  const inventoryTable=document.getElementById('inventoryTable');

  let customer = await db.get('customers', custId);
  if(!customer){alert('找不到客戶'); location.href='index.html'; return;}
  if(!Array.isArray(customer.inventory)) customer.inventory=[];

  function renderInventory(){
    inventoryTable.innerHTML='';
    customer.inventory.forEach((inv,i)=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td class="p-1 border">${inv.item}</td>
        <td class="p-1 border"><input type="number" class="lastQty w-full p-1 rounded-md" value="${inv.lastQty||0}"></td>
        <td class="p-1 border"><input type="number" class="currQty w-full p-1 rounded-md" value="${inv.currQty||0}"></td>
        <td class="p-1 border">${inv.lastDate||''}</td>
        <td class="p-1 border">${inv.lastQtyFromOrder||''}</td>
        <td class="p-1 border text-center">
          <button class="saveBtn px-2 py-1 rounded-md btn bg-[var(--accent)] text-white">儲存</button>
          <button class="delBtn px-2 py-1 rounded-md btn bg-red-500 text-white">刪除</button>
        </td>
      `;
      inventoryTable.appendChild(tr);

      tr.querySelector('.saveBtn').addEventListener('click', async()=>{
        inv.lastQty=Number(tr.querySelector('.lastQty').value);
        inv.currQty=Number(tr.querySelector('.currQty').value);
        await db.put('customers', customer);
        alert('已儲存庫存');
      });

      tr.querySelector('.delBtn').addEventListener('click', async()=>{
        if(confirm('確認刪除此筆庫存?')){
          customer.inventory.splice(i,1);
          await db.put('customers', customer);
          renderInventory();
        }
      });
    });
  }

  renderInventory();

  addStockBtn.addEventListener('click', ()=>{
    const overlay=document.createElement('div');
    overlay.className='fixed inset-0 bg-black/50 flex justify-center items-start z-50 overflow-auto py-10';
    const formDiv=document.createElement('div');
    formDiv.className='bg-[var(--card)] p-4 rounded-lg w-11/12 max-w-2xl';
    formDiv.innerHTML=`
      <h3 class="text-lg font-semibold mb-2">新增庫存</h3>
      <label>品項
        <select id="i_item" class="w-full p-1 rounded-md mb-2">
          <option value="血糖機">血糖機</option>
          <option value="試紙">試紙</option>
          <option value="針頭">針頭</option>
        </select>
      </label>
      <label>上次庫存<input type="number" id="i_lastQty" class="w-full p-1 rounded-md mb-2" value="0"></label>
      <label>此次庫存<input type="number" id="i_currQty" class="w-full p-1 rounded-md mb-2" value="0"></label>
      <div class="flex justify-end gap-2 mt-2">
        <button id="i_cancel" class="px-3 py-1 rounded-md btn bg-red-500 text-white">取消</button>
        <button id="i_save" class="px-3 py-1 rounded-md btn bg-[var(--accent)] text-white">儲存</button>
      </div>
    `;
    overlay.appendChild(formDiv);
    document.body.appendChild(overlay);

    formDiv.querySelector('#i_cancel').addEventListener('click', ()=>overlay.remove());

    formDiv.querySelector('#i_save').addEventListener('click', async()=>{
      const item=formDiv.querySelector('#i_item').value;
      const lastQty=Number(formDiv.querySelector('#i_lastQty').value)||0;
      const currQty=Number(formDiv.querySelector('#i_currQty').value)||0;

      customer.inventory.push({
        item,
        lastQty,
        currQty,
        lastDate:null,
        lastQtyFromOrder:null
      });

      await db.put('customers', customer);
      renderInventory();
      overlay.remove();
      alert('新增庫存成功');
    });
  });

  backBtn.addEventListener('click', ()=>location.href=`customer.html?id=${custId}`);
}

init().catch(e=>{console.error(e); alert('頁面初始化失敗');});
</script>
</body>
</html>
