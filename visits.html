<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拜訪紀錄</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module" src="https://unpkg.com/idb?module"></script>
</head>
<body class="p-4 min-h-screen bg-gray-100">
<div class="max-w-5xl mx-auto">
<header class="flex justify-between items-center mb-4">
  <h1 class="text-xl font-semibold">拜訪紀錄</h1>
  <button id="backBtn" class="px-3 py-2 rounded-md bg-blue-500 text-white">⬅ 返回</button>
</header>

<section class="bg-white p-4 rounded-lg mb-4">
  <button id="addVisitBtn" class="px-3 py-2 rounded-md bg-blue-500 text-white mb-2">＋ 新增拜訪紀錄</button>
  <ul id="visitList" class="space-y-2"></ul>
</section>
</div>

<script type="module">
import { openDB } from 'https://unpkg.com/idb?module';

const db = await openDB('glucoseCRM',1,{
  upgrade(db){ if(!db.objectStoreNames.contains('customers')) db.createObjectStore('customers',{keyPath:'id',autoIncrement:true}); }
});

const params = new URLSearchParams(location.search);
const custId = params.get('id') ? Number(params.get('id')) : null;
if(!custId){ alert('缺少客戶ID'); location.href='index.html'; }

const backBtn = document.getElementById('backBtn');
const addVisitBtn = document.getElementById('addVisitBtn');
const visitList = document.getElementById('visitList');

let customer=null;

async function loadCustomer(){
  customer = await db.get('customers', custId);
  if(!customer){ alert('找不到客戶'); location.href='index.html'; return; }
  if(!customer.visits) customer.visits=[];
  renderVisits();
}

function renderVisits(){
  visitList.innerHTML='';
  customer.visits.forEach((v,i)=>{
    const li=document.createElement('li');
    li.className='p-2 border rounded bg-gray-50';
    li.innerHTML=`
      <div class="flex justify-between">
        <div>
          <strong>${v.date}</strong> - ${v.staff||''}
          <p>${v.note||''}</p>
        </div>
        <button class="viewBtn px-2 py-1 rounded-md bg-green-500 text-white">查看照片(${v.photos?.length||0})</button>
      </div>
    `;
    visitList.appendChild(li);

    li.querySelector('.viewBtn').addEventListener('click',()=>{
      if(!v.photos || v.photos.length===0){ alert('此拜訪無照片'); return; }
      const overlay=document.createElement('div');
      overlay.className='fixed inset-0 bg-black/50 flex justify-center items-center z-50';
      const div=document.createElement('div');
      div.className='bg-white p-4 rounded-lg max-h-[90%] overflow-auto';
      v.photos.forEach(p=>{
        const img=document.createElement('img');
        img.src=p; img.className='mb-2 max-w-full';
        div.appendChild(img);
      });
      const closeBtn=document.createElement('button');
      closeBtn.textContent='關閉';
      closeBtn.className='px-3 py-1 rounded-md bg-red-500 text-white mt-2';
      closeBtn.addEventListener('click',()=>overlay.remove());
      div.appendChild(closeBtn);
      overlay.appendChild(div);
      document.body.appendChild(overlay);
    });
  });
}

// 新增拜訪
addVisitBtn.addEventListener('click',()=>{
  const overlay=document.createElement('div');
  overlay.className='fixed inset-0 bg-black/50 flex justify-center items-start z-50 overflow-auto py-10';
  const formDiv=document.createElement('div');
  formDiv.className='bg-white p-4 rounded-lg w-11/12 max-w-2xl';
  const today=new Date().toISOString().slice(0,10);
  formDiv.innerHTML=`
    <h3 class="text-lg font-semibold mb-2">新增拜訪紀錄</h3>
    <label>日期<input type="date" id="v_date" class="w-full p-1 rounded-md mb-2" value="${today}"></label>
    <label>拜訪人員<input type="text" id="v_staff" class="w-full p-1 rounded-md mb-2"></label>
    <label>備註<textarea id="v_note" class="w-full p-1 rounded-md mb-2"></textarea></label>
    <label>拍照<button id="v_photoBtn" class="px-2 py-1 rounded-md bg-blue-500 text-white ml-2">拍照</button></label>
    <div id="photoPreview" class="flex flex-wrap gap-2 my-2"></div>
    <div class="flex justify-end gap-2 mt-2">
      <button id="v_cancel" class="px-3 py-1 rounded-md bg-red-500 text-white">取消</button>
      <button id="v_save" class="px-3 py-1 rounded-md bg-blue-500 text-white">儲存</button>
    </div>
  `;
  overlay.appendChild(formDiv);
  document.body.appendChild(overlay);

  const photos=[];
  const previewDiv=formDiv.querySelector('#photoPreview');
  formDiv.querySelector('#v_photoBtn').addEventListener('click',async()=>{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    const video=document.createElement('video');
    video.srcObject=stream;
    video.autoplay=true;
    video.className='w-64 mb-2';
    const snapBtn=document.createElement('button');
    snapBtn.textContent='拍攝';
    snapBtn.className='px-2 py-1 rounded-md bg-green-500 text-white mb-2';
    const stopBtn=document.createElement('button');
    stopBtn.textContent='完成';
    stopBtn.className='px-2 py-1 rounded-md bg-red-500 text-white mb-2 ml-2';
    previewDiv.appendChild(video);
    previewDiv.appendChild(snapBtn);
    previewDiv.appendChild(stopBtn);

    snapBtn.addEventListener('click',()=>{
      const canvas=document.createElement('canvas');
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;
      canvas.getContext('2d').drawImage(video,0,0);
      const dataURL=canvas.toDataURL('image/png');
      photos.push(dataURL);
      const img=document.createElement('img'); img.src=dataURL; img.className='w-24';
      previewDiv.appendChild(img);
    });

    stopBtn.addEventListener('click',()=>{
      stream.getTracks().forEach(t=>t.stop());
      video.remove(); snapBtn.remove(); stopBtn.remove();
    });
  });

  formDiv.querySelector('#v_cancel').addEventListener('click',()=>overlay.remove());
  formDiv.querySelector('#v_save').addEventListener('click',async()=>{
    const visit={
      date: formDiv.querySelector('#v_date').value,
      staff: formDiv.querySelector('#v_staff').value,
      note: formDiv.querySelector('#v_note').value,
      photos: photos
    };
    customer.visits.push(visit);
    await db.put('customers',customer);
    renderVisits();
    overlay.remove();
  });
});

backBtn.addEventListener('click',()=>location.href=`customer.html?id=${custId}`);

loadCustomer();
</script>
</body>
</html>
